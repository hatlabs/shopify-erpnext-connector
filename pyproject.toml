[project]
name = "shopify-erpnext-connector"
version = "0.1.0"
description = "Shopify and ERPNext connector: inventory sync from ERPNext to Shopify"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Matti Airas", email = "matti.airas@hatlabs.fi" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[project.scripts]
shopify-erpnext-connector = "shopify_erpnext_connector.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopify_erpnext_connector"]

[tool.ruff]
line-length = 88
lint.select = ["F", "E", "W", "I001"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
