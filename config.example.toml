# Copy to config.toml (gitignored) and fill in the environment's values.
# Secrets do not go here: each is one file in the secrets directory, named
# erpnext_api_key, erpnext_api_secret, shopify_access_token, metrics_token,
# and operator_token_<name> for each operator below.

# staging or production
environment = "staging"

# The SQLite store; its directory must be writable by the connector.
# store_path = "/var/lib/shopify-erpnext-connector/connector.sqlite3"

# Operators allowed to use the CLI; each needs an operator_token_<name> file.
operators = ["alice"]

[shopify]
shop_domain = "example.myshopify.com"
location_id = "gid://shopify/Location/1234567890"

[erpnext]
url = "https://erpnext.example.com"
# The one warehouse whose stock is sold on Shopify.
warehouse = "Stores - TEST"

[email]
# Problem emails go out through ERPNext's outgoing email account. Staging
# keeps this false: problems are still recorded and shown by the CLI.
enabled = false
# Who receives problem emails.
recipient = "operator@example.com"
# The From address, passed to ERPNext explicitly.
sender = "notifications@example.com"

# Optional worker tunables; the defaults are shown.
[worker]
# How often ERPNext is polled for Bin changes.
poll_interval_seconds = 5
# A variant whose stock has gone unpushed this long becomes a problem.
push_stale_after_minutes = 30

# Optional; the default is shown.
[api]
# The port of the operator CLI's API and the metrics endpoint, on every
# interface of the container. TLS is terminated in front of it.
port = 8080
