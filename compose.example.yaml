# Example deployment. Copy next to a filled-in config.toml and a secrets/
# directory holding one file per secret; neither belongs in this repo.
#
# Compose mounts each secret file as is, keeping its host owner and mode, and
# the image runs as uid 10001. Make the secret files readable by that uid:
#
#   chown 10001 secrets/* && chmod 400 secrets/*
#
# The store lives in the `store` volume, and the connector writes a daily
# backup of it to backups/ in the same volume. The connector starts in
# dry-run, so it pushes nothing to Shopify until an operator turns dry-run off.
#
# Caddy terminates TLS in front of the API (see Caddyfile.example) and is the
# only service that publishes a port; the connector publishes none.
services:
  connector:
    image: ghcr.io/hatlabs/shopify-erpnext-connector:latest
    restart: unless-stopped
    # A pass retrying a slow upstream can outlast Docker's default 10 s.
    stop_grace_period: 2m
    volumes:
      - ./config.toml:/etc/shopify-erpnext-connector/config.toml:ro
      - store:/var/lib/shopify-erpnext-connector
    secrets:
      - erpnext_api_key
      - erpnext_api_secret
      - shopify_access_token
      - metrics_token
      - operator_token_alice

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - connector
    ports:
      - "443:443"
    environment:
      CONNECTOR_HOST: connector.example.com
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data

secrets:
  erpnext_api_key:
    file: ./secrets/erpnext_api_key
  erpnext_api_secret:
    file: ./secrets/erpnext_api_secret
  shopify_access_token:
    file: ./secrets/shopify_access_token
  metrics_token:
    file: ./secrets/metrics_token
  operator_token_alice:
    file: ./secrets/operator_token_alice

volumes:
  store:
  caddy_data:
